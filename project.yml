name: SamsungDisplayMate
options:
  bundleIdPrefix: com.ethanpan
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  DisplayMateCore:
    type: framework
    platform: macOS
    sources: [Sources/Core]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SamsungDisplayMate:
    type: application
    platform: macOS
    sources: [Sources/App]
    dependencies:
      - target: DisplayMateCore
      - target: SamsungDisplayMateControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanpan.SamsungDisplayMate
        PRODUCT_NAME: Samsung Display Mate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Samsung Display Mate finds and controls your Samsung monitor on your local network.
        INFOPLIST_KEY_CFBundleDisplayName: Samsung Display Mate
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_FILE: Sources/App/Info.plist
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SamsungDisplayMateControls:
    type: app-extension
    platform: macOS
    sources: [Sources/Controls]
    entitlements:
      path: Sources/Controls/Controls.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Sources/Controls/Info.plist
      properties:
        CFBundleDisplayName: Samsung Display Mate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanpan.SamsungDisplayMate.Controls
        GENERATE_INFOPLIST_FILE: YES
  DisplayMateCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/Core]
    dependencies:
      - target: DisplayMateCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SamsungDisplayMate:
    build:
      targets:
        SamsungDisplayMate: all
    test:
      targets: [DisplayMateCoreTests]
